workflows:
  ios-workflow:
    name: Flutter iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: flutter_frontend
    environment:
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
          cd ios && pod repo update && cd ..
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/ios/iphoneos/*.app
      - "*.ipa"

  android-workflow:
    name: Flutter Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: flutter_frontend
    environment:
      flutter: 3.27.4
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - flutter_frontend/build/app/outputs/flutter-apk/*.apk
