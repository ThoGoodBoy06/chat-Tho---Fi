  <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    window.webQrScanner = {
      stream: null,
      video: null,
      animationFrameId: null,
      isScanning: false,
      start: async function(containerId) {
        this.pause();
        this.isScanning = true;
        console.log('[WebQrScanner] Initializing camera for container:', containerId);

        try {
          let stream = this.stream;

          // Reuse existing active stream if available to prevent browser permission prompt
          if (!stream || !stream.active || !stream.getVideoTracks().some(t => t.readyState === 'live')) {
            console.log('[WebQrScanner] Requesting new camera stream via getUserMedia...');
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
              });
            } catch(err1) {
              console.warn('[WebQrScanner] FacingMode environment failed, trying simple video constraint:', err1);
              stream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            this.stream = stream;
          } else {
            console.log('[WebQrScanner] Reusing active camera stream (no permission dialog required)');
          }

          const container = document.getElementById(containerId);
          if (!container) {
            console.error('[WebQrScanner] Target container element not found in DOM:', containerId);
            return false;
          }

          const video = document.createElement('video');
          video.setAttribute("playsinline", "true");
          video.autoplay = true;
          video.muted = true;
          video.style.width = '100%';
          video.style.height = '100%';
          video.style.objectFit = 'cover';
          video.srcObject = stream;

          container.innerHTML = '';
          container.appendChild(video);
          this.video = video;

          await video.play().catch(e => console.error('[WebQrScanner] video.play() error:', e));

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          const tick = () => {
            if (!this.isScanning) return;

            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

              if (window.jsQR) {
                const code = window.jsQR(imageData.data, imageData.width, imageData.height, {
                  inversionAttempts: "dontInvert"
                });

                if (code && code.data && this.isScanning) {
                  console.log('[WebQrScanner] QR Code detected:', code.data);
                  const qrData = code.data;
                  this.isScanning = false;

                  // Pause video scanning loop but keep stream active for fast re-use
                  this.pause();

                  // Dispatch custom DOM event to Flutter
                  window.dispatchEvent(new CustomEvent('qr-scanned', { detail: qrData }));
                  return;
                }
              }
            }

            if (this.isScanning) {
              this.animationFrameId = requestAnimationFrame(tick);
            }
          };

          this.animationFrameId = requestAnimationFrame(tick);
          return true;
        } catch(err) {
          console.error('[WebQrScanner] Error accessing camera (NotAllowedError/NotFoundError):', err);
          return false;
        }
      },
      scanImage: function(dataUrl) {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          if (window.jsQR) {
            const code = window.jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: "dontInvert"
            });
            if (code && code.data) {
              console.log('[WebQrScanner] Image QR Code detected:', code.data);
              this.pause();
              window.dispatchEvent(new CustomEvent('qr-scanned', { detail: code.data }));
            } else {
              window.dispatchEvent(new CustomEvent('qr-scan-failed', { detail: 'No QR code found in image' }));
            }
          }
        };
        img.src = dataUrl;
      },
      pause: function() {
        this.isScanning = false;
        if (this.animationFrameId) {
          cancelAnimationFrame(this.animationFrameId);
          this.animationFrameId = null;
        }
        if (this.video) {
          try {
            this.video.pause();
            this.video.srcObject = null;
            this.video.remove();
          } catch(e) {}
          this.video = null;
        }
      },
      stop: function() {
        this.pause();
        if (this.stream) {
          try {
            this.stream.getTracks().forEach(track => {
              track.stop();
              console.log('[WebQrScanner] Camera track stopped:', track.label);
            });
          } catch(e) {
            console.error('[WebQrScanner] Error stopping tracks:', e);
          }
          this.stream = null;
        }
      }
    };
  </script>

    window.registerFCMAndGetToken = async function(vapidKey) {
      if (!('serviceWorker' in navigator) || !('Notification' in window)) {
        console.warn('[FCM Web] Service Worker hoặc Notification API không được hỗ trợ trên trình duyệt này.');

      try {
        if (!firebase.apps.length) {
          const firebaseConfig = {
            apiKey: "AIzaSyDk6fayVDs0YbbhwldYxgHcN4nnjnPwmRc",
            authDomain: "chat-tho-fi.firebaseapp.com",
            projectId: "chat-tho-fi",
            storageBucket: "chat-tho-fi.firebasestorage.app",
            messagingSenderId: "513501588929",
            appId: "1:513501588929:web:54fd6c5fab227868bfd340",
          };
          firebase.initializeApp(firebaseConfig);
        }

        const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' });
        await registration.update();
        await navigator.serviceWorker.ready;

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          console.warn('[FCM Web] ⚠️ Quyền thông báo bị từ chối hoặc chưa được duyệt (Status: ' + permission + ').');

        const messaging = firebase.messaging();
        const token = await messaging.getToken({
          vapidKey: effectiveVapidKey,
          serviceWorkerRegistration: registration
        });
        if (token) {
          console.log('[FCM Web] ✅ Lấy FCM Token thành công:', token.substring(0, 15) + '...');

      } catch (err) {

  <script>
    // Dismiss splash screen smoothly when Flutter first frame is rendered
    window.dismissSplashScreen = function() {
      var el = document.getElementById('loading-screen');
      if (el && !el.dataset.dismissed) {
        el.dataset.dismissed = 'true';
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        setTimeout(function() {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 360);
      }
    };

    window.addEventListener('flutter-first-frame', function() {
      window.dismissSplashScreen();
    });

    // Safety auto-dismiss for splash loading screen after Flutter starts
    setTimeout(function() {
      window.dismissSplashScreen();
    }, 4500);

    // iOS Standalone Link Handling: Ngăn Safari mở tab mới khi bấm link/chuyển trang
    if (("standalone" in window.navigator) && window.navigator.standalone) {
      document.addEventListener('click', function(e) {
        var ctarget = e.target;
        while (ctarget && ctarget.nodeName !== 'A') {
          ctarget = ctarget.parentNode;
        }
        if (ctarget && ctarget.nodeName === 'A' && ctarget.getAttribute('href')) {
          var href = ctarget.getAttribute('href');
          if (href.indexOf('http') !== 0 || href.indexOf(window.location.host) !== -1) {
            e.preventDefault();
            window.location.href = href;
          }
        }
      }, false);
    }
  </script>

    const ChatSounds = {
      _ctx: null,
      _init() {
        if (!this._ctx) {
          this._ctx = new (window.AudioContext || window.webkitAudioContext)();

        if (this._ctx.state === 'suspended') {
          this._ctx.resume().catch(() => {});
        }
        return this._ctx;

      playSend() {
        try {
          const ctx = this._init();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.12);

  <script>
    window._currentAiConversationId = null;
    window._chatScreenState = null;
    window._isAiTabActive = false;

    const AI_GREETINGS = [
      "Hôm nay bạn thế nào, {name}?",
      "Tôi có thể giúp gì cho bạn hôm nay, {name}?",
      "Chào {name}, bạn đang nghĩ gì thế?",
      "Hôm nay bạn muốn cùng tôi tìm hiểu điều gì?",
      "Rất vui được gặp lại {name}! Cần tôi hỗ trợ gì nào?",
      "Bạn đã sẵn sàng khám phá những điều mới chưa, {name}?",
      "Cần tôi hỗ trợ điều gì hôm nay không, {name}?"
    ];

    function getAiUserName() {
      try {
        const tk = getAiAuthToken();
        if (tk && tk.includes('.')) {
          const parts = tk.split('.');
          if (parts.length > 1) {
            const payload = JSON.parse(atob(parts[1]));
            if (payload && payload.username) {
              const u = payload.username.trim();
              return u.charAt(0).toUpperCase() + u.slice(1);
            }
          }
        }
      } catch(e) {}
      try {
        const rawU = localStorage.getItem('flutter.username') || localStorage.getItem('username');
        if (rawU) {
          const u = rawU.replace(/"/g, '').trim();
          if (u) return u.charAt(0).toUpperCase() + u.slice(1);
        }
      } catch(e) {}
      return 'Tho';
    }

    window.pickRandomAiGreeting = function() {
      const name = getAiUserName();
      const template = AI_GREETINGS[Math.floor(Math.random() * AI_GREETINGS.length)];
      return template.replace(/{name}/g, name);
    };

    window.updateAiWelcomeState = function() {
      const el = document.getElementById('ai-welcome-view');
      if (!el) return;

      const isTabActive = !!window._isAiTabActive;
      const s = window._chatScreenState;
      const hasMessages = s && s.cx && s.cx.length > 0;

      if (isTabActive && !hasMessages) {
        const titleEl = document.getElementById('ai-welcome-title');
        if (titleEl) {
          titleEl.textContent = window.pickRandomAiGreeting();
        }
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    };


    window.scrollAiChatToBottom = function() {
      setTimeout(function() {
        const pane = document.querySelector('flt-glass-pane') || document.body;
        const target = (pane && pane.shadowRoot) ? (pane.shadowRoot.querySelector('canvas') || pane.shadowRoot) : pane;
        if (target) {
          for (let k = 0; k < 12; k++) {
            target.dispatchEvent(new WheelEvent('wheel', {
              deltaY: 3000,
              deltaMode: 0,
              bubbles: true,
              cancelable: true,
              clientX: window.innerWidth / 2,
              clientY: window.innerHeight / 2
            }));
          }
        }
      }, 150);
      setTimeout(function() {
        const pane = document.querySelector('flt-glass-pane') || document.body;
        const target = (pane && pane.shadowRoot) ? (pane.shadowRoot.querySelector('canvas') || pane.shadowRoot) : pane;
        if (target) {
          for (let k = 0; k < 12; k++) {
            target.dispatchEvent(new WheelEvent('wheel', {
              deltaY: 3000,
              deltaMode: 0,
              bubbles: true,
              cancelable: true,
              clientX: window.innerWidth / 2,
              clientY: window.innerHeight / 2
            }));
          }
        }
      }, 400);
    };

    let _lastAiRefreshTime = 0;
    window.refreshAiTabHistory = async function() {
      const now = Date.now();
      if (now - _lastAiRefreshTime < 800) return;
      _lastAiRefreshTime = now;
      try {
        const tk = getAiAuthToken();
        if (!tk) return;
        const res = await fetch('/api/ai/chat/history', {
          headers: { 'Authorization': 'Bearer ' + tk }
        });
        const data = await res.json();
        if (data && data.success) {
          if (data.conversationId) {
            window._currentAiConversationId = data.conversationId;
          }
          if (window._chatScreenState && window._chatScreenState.cx) {
            const s = window._chatScreenState;
            s.cx.length = 0;
            if (Array.isArray(data.messages) && data.messages.length > 0) {
              data.messages.forEach(function(m) {
                if (window._dartMapHelper) {
                  s.cx.push(window._dartMapHelper(m.role === 'user' ? 'user' : 'ai', m.content || ''));
                }
              });
            }
            if (s.c != null && typeof window._dartSetStateHelper === 'function') {
              s.K(new window._dartSetStateHelper());
            }
            if (Array.isArray(data.messages) && data.messages.length > 0) {
              window.scrollAiChatToBottom();
            }
          }
          if (typeof window.updateAiWelcomeState === 'function') {
            window.updateAiWelcomeState();
          }
        }
      } catch (err) {
        console.warn('Lỗi refresh AI history:', err);
      }
    };

    window.updateAiMenuBtnState = function(isActive) {
      window._isAiTabActive = !!isActive;
      if (isActive) {
        window.refreshAiTabHistory();
      }
      if (typeof window.updateAiWelcomeState === 'function') {
        window.updateAiWelcomeState();
      }
    };

    window.showAiConfirm = function({ title, desc, onConfirm }) {
      const modal = document.getElementById('ai-confirm-modal');
      if (!modal) {
        if (typeof onConfirm === 'function') onConfirm();
        return;
      }
      if (title) modal.querySelector('.ai-confirm-title').textContent = title;
      if (desc) modal.querySelector('.ai-confirm-desc').textContent = desc;
      const okBtn = document.getElementById('ai-confirm-btn-ok');
      okBtn.onclick = function() {
        window.closeAiConfirmModal();
        if (typeof onConfirm === 'function') onConfirm();
      };
      modal.classList.add('active');
    };

    window.closeAiConfirmModal = function() {
      const modal = document.getElementById('ai-confirm-modal');
      if (modal) modal.classList.remove('active');
    };

    window.clearCurrentAiChat = async function() {
      console.log('🚀 Clearing current AI chat...');
      try {
        const tk = getAiAuthToken();
        const convId = window._currentAiConversationId;
        
        if (convId) {
          await fetch('/api/ai/chat/session/' + convId, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + tk }
          });
        } else {
          await fetch('/api/ai/chat/history', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + tk }
          });
        }

        window._currentAiConversationId = null;

        if (window._chatScreenState && window._chatScreenState.cx) {
          const s = window._chatScreenState;
          s.cx.length = 0;
          if (window._dartMapHelper) {
            s.cx.push(window._dartMapHelper('ai', 'Đã xoá cuộc trò chuyện thành công! Tôi có thể giúp gì cho bạn hôm nay?'));
          }
          if (s.c != null) s.K(new window._dartSetStateHelper());
        }

        if (typeof window.fetchAiSessions === 'function') {
          window.fetchAiSessions();
        }
      } catch (err) {
        console.error('Lỗi khi xóa cuộc trò chuyện:', err);
      }
    };

    window.openAiHistory = function() {
      console.log('🚀 openAiHistory called!');
      try {
        const isDark = (document.body && document.body.classList.contains('dark')) || (localStorage.getItem('flutter.isDarkMode') === 'true');
        const panel = document.getElementById('ai-drawer-panel');
        const backdrop = document.getElementById('ai-drawer-backdrop');
        if (panel && backdrop) {
          if (isDark) panel.classList.add('dark'); else panel.classList.remove('dark');
          panel.classList.add('active');
          backdrop.classList.add('active');
          if (typeof window.fetchAiSessions === 'function') {
            window.fetchAiSessions();
          }
        }
      } catch (err) {
        console.error('Error opening AI history drawer:', err);
      }
    };

    window.closeAiHistory = function() {
      console.log('🚀 closeAiHistory called!');
      try {
        const panel = document.getElementById('ai-drawer-panel');
        const backdrop = document.getElementById('ai-drawer-backdrop');
        if (panel) panel.classList.remove('active');
        if (backdrop) backdrop.classList.remove('active');
      } catch (err) {
        console.error('Error closing AI history drawer:', err);
      }
    };

    function getAiAuthToken() {
      let tk = '';
      try {
        const raw = localStorage.getItem('flutter.authToken') || localStorage.getItem('authToken');
        if (raw) {
          if (raw.startsWith('"') && raw.endsWith('"')) tk = JSON.parse(raw);
          else tk = raw;
        }
      } catch(e) {
        tk = localStorage.getItem('flutter.authToken') || localStorage.getItem('authToken') || '';
      }
      return (tk || '').replace(/^"+|"+$/g, '').trim();
    }

    window.fetchAiSessions = async function() {
      const container = document.getElementById('ai-sessions-list');
      if (!container) return;
      try {
        const res = await fetch('/api/ai/chat/sessions', {
          headers: { 'Authorization': 'Bearer ' + getAiAuthToken() }
        });
        const data = await res.json();
        if (data && data.success && Array.isArray(data.sessions)) {
          if (data.sessions.length === 0) {
            container.innerHTML = '<div class="ai-drawer-empty">Chưa có cuộc trò chuyện nào.<br>Bấm "+ Cuộc trò chuyện mới" để bắt đầu!</div>';
            return;
          }
          container.innerHTML = '';
          data.sessions.forEach(function(s) {
            const isActive = window._currentAiConversationId === s.id;
            const item = document.createElement('div');
            item.className = 'ai-session-item' + (isActive ? ' active' : '');
            
            const timeStr = s.createdAt ? new Date(s.createdAt).toLocaleDateString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '';
            
            item.innerHTML = `
              <div class="ai-session-info" style="cursor:pointer;" onclick="window.selectAiSession('${s.id}')">
                <div class="ai-session-name">${escapeAiHtml(s.name || 'Cuộc trò chuyện mới')}</div>
                <div class="ai-session-time">${timeStr}</div>
              </div>
              <button class="ai-session-delete-btn" title="Xóa" onclick="window.deleteAiSession('${s.id}', event)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            `;
            container.appendChild(item);
          });
        }
      } catch(e) {
        container.innerHTML = '<div class="ai-drawer-empty">Không thể tải lịch sử trò chuyện.</div>';
      }
    };

    function escapeAiHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.createNewAiSession = async function() {
      try {
        const res = await fetch('/api/ai/chat/session/new', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getAiAuthToken(), 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (data && data.success && data.session) {
          window._currentAiConversationId = data.session.id;
          window.closeAiHistory();
          if (window._chatScreenState && window._chatScreenState.cx) {
            const s = window._chatScreenState;
            s.cx.length = 0;
            if (s.c != null) s.K(new window._dartSetStateHelper());
          }
          if (typeof window.updateAiWelcomeState === 'function') {
            window.updateAiWelcomeState();
          }
          if (typeof window.fetchAiSessions === 'function') {
            window.fetchAiSessions();
          }
        }
      } catch(e) {
        console.error('Lỗi tạo phiên chat mới:', e);
      }
    };

    window.selectAiSession = async function(id) {
      try {
        window._currentAiConversationId = id;
        window.closeAiHistory();
        const res = await fetch('/api/ai/chat/history?conversationId=' + id, {
          headers: { 'Authorization': 'Bearer ' + getAiAuthToken() }
        });
        const data = await res.json();
        if (data && data.success && Array.isArray(data.messages)) {
          if (window._chatScreenState && window._chatScreenState.cx) {
            const s = window._chatScreenState;
            s.cx.length = 0;
            if (data.messages.length === 0) {
              // Để trống để hiện màn chào mừng Gemini
            } else {
              data.messages.forEach(function(m) {
                if (window._dartMapHelper) {
                  s.cx.push(window._dartMapHelper(m.role === 'user' ? 'user' : 'ai', m.content || ''));
                }
              });
            }
            if (s.c != null) s.K(new window._dartSetStateHelper());
          }
          if (typeof window.updateAiWelcomeState === 'function') {
            window.updateAiWelcomeState();
          }
        }
      } catch(e) {
        console.error('Lỗi tải tin nhắn phiên chat:', e);
      }
    };

    window.deleteAiSession = function(id, evt) {
      if (evt) {
        evt.stopPropagation();
        evt.preventDefault();
      }
      window.showAiConfirm({
        title: 'Xóa cuộc trò chuyện?',
        desc: 'Bạn có chắc chắn muốn xóa cuộc trò chuyện này không? Thao tác này không thể hoàn tác.',
        onConfirm: async function() {
          console.log('🚀 Deleting session:', id);
          try {
            const res = await fetch('/api/ai/chat/session/' + id, {
              method: 'DELETE',
              headers: { 'Authorization': 'Bearer ' + getAiAuthToken() }
            });
            const data = await res.json();
            console.log('🚀 Delete result:', data);
            if (data && data.success) {
              const wasCurrent = (!window._currentAiConversationId || window._currentAiConversationId === id);
              if (wasCurrent) {
                window._currentAiConversationId = null;
                if (window._chatScreenState && window._chatScreenState.cx) {
                  const s = window._chatScreenState;
                  s.cx.length = 0;
                  if (window._dartMapHelper) {
                    s.cx.push(window._dartMapHelper('ai', 'Đã xoá cuộc trò chuyện thành công! Tôi có thể giúp gì cho bạn hôm nay?'));
                  }
                  if (s.c != null) s.K(new window._dartSetStateHelper());
                }
              }
              await window.fetchAiSessions();
            } else {
              alert(data?.error || 'Không thể xóa cuộc trò chuyện.');
            }
          } catch(e) {
            console.error('Lỗi xóa phiên chat:', e);
          }
        }
      });
    };

    window.deleteAllAiSessions = function() {
      window.showAiConfirm({
        title: 'Xóa toàn bộ lịch sử?',
        desc: 'Bạn có chắc chắn muốn xóa tất cả các cuộc trò chuyện AI không? Thao tác này không thể hoàn tác.',
        onConfirm: async function() {
          console.log('🚀 Deleting all AI sessions...');
          try {
            const res = await fetch('/api/ai/chat/sessions/all', {
              method: 'DELETE',
              headers: { 'Authorization': 'Bearer ' + getAiAuthToken() }
            });
            const data = await res.json();
            console.log('🚀 Delete all result:', data);
            if (data && data.success) {
              window._currentAiConversationId = null;
              if (window._chatScreenState && window._chatScreenState.cx) {
                const s = window._chatScreenState;
                s.cx.length = 0;
                if (s.c != null) s.K(new window._dartSetStateHelper());
              }
              if (typeof window.updateAiWelcomeState === 'function') {
                window.updateAiWelcomeState();
              }
              await window.fetchAiSessions();
            } else {
              alert(data?.error || 'Không thể xóa toàn bộ lịch sử.');
            }
          } catch(e) {
            console.error('Lỗi xóa toàn bộ phiên chat:', e);
          }
        }
      });
    };

    window.showAiThinking = function(show) {
      const el = document.getElementById('ai-typing-float');
      if (!el) return;
      if (show) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    };
  </script>
