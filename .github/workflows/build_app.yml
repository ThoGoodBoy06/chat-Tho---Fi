name: Build Mobile Apps (iOS .ipa & Android .apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd flutter_frontend
          flutter pub get

      - name: Build iOS No-Codesign IPA
        run: |
          cd flutter_frontend
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r ChatThoFi.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ChatThoFi-iOS-ipa
          path: flutter_frontend/ChatThoFi.ipa

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd flutter_frontend
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_frontend
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ChatThoFi-Android-apk
          path: flutter_frontend/build/app/outputs/flutter-apk/app-release.apk
