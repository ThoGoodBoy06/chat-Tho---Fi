name: Build iOS IPA Only

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd flutter_frontend
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd flutter_frontend/ios
          pod install

      - name: Build iOS App Bundle
        run: |
          cd flutter_frontend
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package into IPA
        run: |
          cd flutter_frontend
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ChatThoFi.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatThoFi-iOS-ipa
          path: flutter_frontend/ChatThoFi.ipa
