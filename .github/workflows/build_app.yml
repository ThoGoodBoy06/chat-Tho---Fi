name: Build iOS IPA Only

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd flutter_frontend
          flutter pub get

      - name: Generate iOS Configurations
        run: |
          cd flutter_frontend
          flutter build ios --config-only --release --no-codesign

      - name: Install CocoaPods
        run: |
          cd flutter_frontend/ios
          pod install

      - name: Build iOS App Bundle
        run: |
          cd flutter_frontend
          flutter build ios --release --no-codesign || (cd ios && xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ../build/ios build)

      - name: Package Payload into IPA
        run: |
          cd flutter_frontend
          mkdir -p build/ios/iphoneos
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/Build/Products/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/Build/Products/Release-iphoneos/Runner.app"
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Runner.app not found!"
            exit 1
          fi

          mkdir -p build/ios/iphoneos/Payload
          cp -r "$APP_PATH" build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r app-release.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Release
          path: flutter_frontend/build/ios/iphoneos/app-release.ipa
          retention-days: 7
